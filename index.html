<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор прибыли за минуты</title>
<style>
  :root {
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: #e2e2e2;
    --positive: #1a7f37;
    --danger: #c9302c;
    --warning-bg: #fdf3e0;
    --warning-text: #8a5a00;
    --danger-bg: #fbeae9;
    --surface: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #f0f0f0;
      --text-secondary: #9a9a9a;
      --border: #3a3a3a;
      --positive: #4cc273;
      --danger: #e4645f;
      --warning-bg: #3a2f16;
      --warning-text: #e5b25c;
      --danger-bg: #3d1f1e;
      --surface: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text-primary);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .calc-root {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 16px;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 24px;
  }
  .inputs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .field-label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .calc-input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text-primary);
    font: inherit;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    outline: none;
    transition: border-color 120ms ease-out;
  }
  .calc-input:focus { border-color: var(--text-primary); }
  .calc-input::placeholder { color: var(--text-secondary); opacity: 0.6; }

  .hero { margin-bottom: 24px; }
  .hero-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .hero-value {
    font-size: 42px;
    font-weight: 500;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .hero-value.is-positive { color: var(--positive); }
  .hero-value.is-negative { color: var(--danger); }

  .metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .metric {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .metric-value {
    font-size: 17px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .metric-value.is-positive { color: var(--positive); }
  .metric-value.is-negative { color: var(--danger); }

  .status {
    display: inline-block;
    margin-top: 16px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  .status--danger { background: var(--danger-bg); color: var(--danger); }
  .status--warning { background: var(--warning-bg); color: var(--warning-text); }

  @media (max-width: 520px) {
    .inputs { grid-template-columns: 1fr; }
    .metrics { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="calc-root">
  <h1>Калькулятор прибыли за минуты</h1>

  <div class="inputs">
    <label>
      <span class="field-label">Цена покупки, x за минуту</span>
      <input class="calc-input" id="buyPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="например, 2.5" value="2">
    </label>
    <label>
      <span class="field-label">Цена продажи, y за минуту</span>
      <input class="calc-input" id="sellPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="например, 3.5" value="3">
    </label>
    <label>
      <span class="field-label">Количество минут</span>
      <input class="calc-input" id="minutes" type="number" inputmode="decimal" min="0" step="any" placeholder="например, 100" value="100">
    </label>
  </div>

  <div class="hero">
    <div class="hero-label">Общая прибыль</div>
    <div class="hero-value" id="totalProfit">—</div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Прибыль за минуту (y − x)</div>
      <div class="metric-value" id="profitPerMin">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Наценка к закупке</div>
      <div class="metric-value" id="markup">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Себестоимость (x × мин)</div>
      <div class="metric-value" id="totalCost">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Выручка (y × мин)</div>
      <div class="metric-value" id="totalRevenue">—</div>
    </div>
  </div>

  <div id="statusRow"></div>
</div>

<script>
(function () {
  var buyEl = document.getElementById('buyPrice');
  var sellEl = document.getElementById('sellPrice');
  var minEl = document.getElementById('minutes');
  var totalProfitEl = document.getElementById('totalProfit');
  var profitPerMinEl = document.getElementById('profitPerMin');
  var markupEl = document.getElementById('markup');
  var totalCostEl = document.getElementById('totalCost');
  var totalRevenueEl = document.getElementById('totalRevenue');
  var statusRow = document.getElementById('statusRow');

  function fmt(n) {
    return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 4 }).format(n);
  }
  function fmtMoney(n) {
    return new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 4 }).format(n);
  }
  function setTone(el, v) {
    el.classList.remove('is-positive', 'is-negative');
    if (v > 0) el.classList.add('is-positive');
    else if (v < 0) el.classList.add('is-negative');
  }
  function parseNum(el) {
    var v = parseFloat(String(el.value).replace(',', '.'));
    return isFinite(v) && v >= 0 ? v : null;
  }

  function render() {
    var x = parseNum(buyEl);
    var y = parseNum(sellEl);
    var m = parseNum(minEl);
    statusRow.innerHTML = '';

    if (x === null || y === null || m === null) {
      totalProfitEl.textContent = '—';
      totalProfitEl.classList.remove('is-positive', 'is-negative');
      profitPerMinEl.textContent = '—';
      markupEl.textContent = '—';
      totalCostEl.textContent = '—';
      totalRevenueEl.textContent = '—';
      return;
    }

    var ppm = y - x;
    var total = ppm * m;
    var cost = x * m;
    var revenue = y * m;

    totalProfitEl.textContent = fmtMoney(total);
    setTone(totalProfitEl, total);

    profitPerMinEl.textContent = fmt(ppm);
    setTone(profitPerMinEl, ppm);

    markupEl.textContent = x > 0 ? fmt((ppm / x) * 100) + '%' : '—';
    setTone(markupEl, ppm);

    totalCostEl.textContent = fmtMoney(cost);
    totalRevenueEl.textContent = fmtMoney(revenue);

    if (ppm < 0) {
      statusRow.innerHTML = '<span class="status status--danger">Продажа ниже закупки — убыток</span>';
    } else if (ppm === 0) {
      statusRow.innerHTML = '<span class="status status--warning">Нулевая маржа</span>';
    }
  }

  buyEl.addEventListener('input', render);
  sellEl.addEventListener('input', render);
  minEl.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
